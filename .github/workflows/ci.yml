name: ClashFree

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clashfree
          POSTGRES_PASSWORD: clashfree
          POSTGRES_DB: clashfree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clashfree -d clashfree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clashfree:clashfree@127.0.0.1:5432/clashfree
      AUTH_DEBUG: "true"
      SESSION_SECRET: ci-session-secret
      SEED_PASSWORD: ClashFree!dev
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run python -m app.cli seed_phase7
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  auth-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clashfree
          POSTGRES_PASSWORD: clashfree
          POSTGRES_DB: clashfree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clashfree -d clashfree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clashfree:clashfree@127.0.0.1:5432/clashfree
      AUTH_DEBUG: "true"
      VITE_API_BASE_URL: ""
      SESSION_SECRET: ci-session-secret
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://127.0.0.1:4173
      SEED_PASSWORD: ClashFree!dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate and seed API
        working-directory: backend
        run: |
          uv sync --group dev
          uv run alembic upgrade head
          uv run python -m app.cli seed_phase2
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Run auth e2e
        working-directory: frontend
        run: npm run test:e2e:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-auth-output
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

